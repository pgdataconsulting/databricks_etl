# Schema contract for the gold customer_orders output.
# strict: extra columns must not leak into the published gold dataset.
dataset: gold.customer_orders
strict: true
columns:
  - {name: customer_id, type: int, nullable: false}
  - {name: customer_name, type: string, nullable: true}
  - {name: order_id, type: int, nullable: false}
  - {name: order_date, type: string, nullable: true}
  - {name: order_amount, type: double, nullable: true}
  - {name: business_date, type: date, nullable: false}
