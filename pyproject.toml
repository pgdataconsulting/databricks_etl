[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks-yaml-etl"
dynamic = ["version"]
description = "Declarative YAML-based ETL framework for Databricks: validated configs, schema contracts, data quality gates, lineage and audit built in."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PG Data Consulting" }]
keywords = ["databricks", "pyspark", "delta-lake", "etl", "yaml", "data-engineering", "unity-catalog"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
# PySpark and Delta are provided by the Databricks runtime, so they are not
# install requirements: `pip install databricks-yaml-etl` is enough to
# validate and document configurations (CI gates, pre-commit hooks).
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Local execution outside Databricks (the test suite, the quickstart).
spark = [
    "pyspark>=3.5,<5",
    "delta-spark>=3.2,<5",
]
dev = [
    "databricks-yaml-etl[spark]",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Kept to one minor version each: a newer formatter or type checker can
    # change what "clean" means, and that should arrive as a reviewed bump.
    "ruff~=0.17.5",
    "mypy~=2.4.1",
    "types-PyYAML>=6.0",
    "build>=1.2",
    "twine>=6.0",
    "pre-commit>=4.0",
]

[project.scripts]
# `etl-framework` is the command line name; `etl_framework` is the same
# entry point under a name without a hyphen, for the Databricks
# python_wheel_task `entry_point` field.
etl-framework = "etl_framework.cli:entrypoint"
etl_framework = "etl_framework.cli:entrypoint"

[project.urls]
Homepage = "https://github.com/pgdataconsulting/databricks_etl"
Documentation = "https://github.com/pgdataconsulting/databricks_etl/blob/main/docs/usage.md"
Repository = "https://github.com/pgdataconsulting/databricks_etl"
Issues = "https://github.com/pgdataconsulting/databricks_etl/issues"
Changelog = "https://github.com/pgdataconsulting/databricks_etl/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "etl_framework.__version__" }

[tool.setuptools.packages.find]
include = ["etl_framework*"]

[tool.setuptools.package-data]
etl_framework = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true

[tool.coverage.run]
source = ["etl_framework"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "B",        # likely bugs
    "BLE",      # blind excepts must be justified
    "C4",       # comprehensions
    "PIE",      # misc. cleanups
    "RUF",      # ruff-specific
    "SIM",      # simplifications
    "UP",       # modern syntax for the supported Python versions
]

[tool.ruff.lint.per-file-ignores]
# PySpark is imported inside the functions that need it, so the package
# imports (and configs validate) without Spark installed.
"etl_framework/**" = ["PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["etl_framework"]

[tool.mypy]
python_version = "3.10"
files = ["etl_framework"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
ignore_missing_imports = true
