name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Formatting
        run: ruff format --check .
      - name: Types
        run: mypy

  configs:
    # Runs with the package alone, without PySpark: this is the gate a team
    # would put in front of its own config repository.
    name: Validate configs (no Spark)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: PySpark must not be needed
        run: "! python -c 'import pyspark'"
      - name: Validate every pipeline configuration
        run: etl-framework validate configs/*.yaml configs/medallion/*.yaml
      - name: Generated pipeline docs are up to date
        run: |
          make pipeline-docs
          git diff --exit-code -- docs/pipelines

  test:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.10", label: "Spark 3.5", spark: "pyspark>=3.5,<3.6", delta: "delta-spark>=3.3,<3.4"}
          - {python: "3.11", label: "Spark 3.5", spark: "pyspark>=3.5,<3.6", delta: "delta-spark>=3.3,<3.4"}
          - {python: "3.12", label: "Spark 4.0", spark: "pyspark>=4.0,<4.1", delta: "delta-spark>=4.0,<4.1"}
          - {python: "3.12", label: "latest Spark", spark: "pyspark", delta: "delta-spark"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]" "${{ matrix.spark }}" "${{ matrix.delta }}"
      - name: Tests with coverage
        run: pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.label == 'latest Spark'
        with:
          name: coverage
          path: coverage.xml

  build:
    name: Build and check the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: The built wheel installs and runs on its own
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          /tmp/wheel-check/bin/etl-framework --version
          /tmp/wheel-check/bin/etl-framework validate configs/*.yaml configs/medallion/*.yaml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  bundle:
    # Checks the bundle against the schema the Databricks CLI publishes.
    # `bundle validate` itself needs a workspace and runs in the deploy workflow.
    name: Asset Bundle schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: databricks/setup-cli@2da6132749245fbffb3c10d57cec219de3669967 # v1.26.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema
      - run: databricks bundle schema > "$RUNNER_TEMP/bundle.schema.json"
      - run: check-jsonschema --schemafile "$RUNNER_TEMP/bundle.schema.json" databricks.yml resources/*.yml

  terraform:
    name: Terraform (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [platform, governance]
    defaults:
      run:
        working-directory: infra/terraform/stacks/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: Formatting
        run: terraform fmt -check -recursive ../..
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
      # Mocked providers: asserts names, input validation and the access
      # model (who gets which privilege) without any cloud credentials.
      - run: terraform test
